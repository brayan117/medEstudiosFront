<app-layout>
  <div class="preparacion-container">
    <div class="header">
      <button class="btn-back" (click)="goBack()">
        <i class="fas fa-arrow-left"></i>
        Volver
      </button>
      <h1>Preparación de Estudio</h1>
    </div>

    <div class="content" *ngIf="patient">
      <!-- Patient Info Summary -->
      <div class="patient-summary">
        <div class="summary-item">
          <span class="summary-label">Paciente:</span>
          <span class="summary-value">{{ patient.patientName }}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Estudio:</span>
          <span class="summary-value">{{ getStudyTypeLabel(patient.studyType) }} - {{ patient.studyType }}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Fecha/Hora:</span>
          <span class="summary-value">{{ patient.dateTime }}</span>
        </div>
      </div>

      <form (ngSubmit)="submitPreparacion()">
        <!-- Preparación del Paciente -->
        <div class="form-section">
          <h3 class="section-title">Preparación del Paciente</h3>
          
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" [(ngModel)]="preparacionForm.pacientePreparado" name="pacientePreparado">
              <span>Paciente preparado y listo para el estudio</span>
            </label>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" [(ngModel)]="preparacionForm.ayunoCumplido" name="ayunoCumplido">
              <span>Ayuno cumplido (según protocolo)</span>
            </label>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Peso (kg)</label>
              <input type="number" class="form-input" [(ngModel)]="preparacionForm.pesoPaciente" name="pesoPaciente" min="0" step="0.1">
            </div>
            <div class="form-group">
              <label class="form-label">Altura (cm)</label>
              <input type="number" class="form-input" [(ngModel)]="preparacionForm.alturaPaciente" name="alturaPaciente" min="0" step="1">
            </div>
          </div>
        </div>

        <!-- Contraste -->
        <div class="form-section">
          <h3 class="section-title">Administración de Contraste</h3>
          
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" [(ngModel)]="preparacionForm.contrasteAdministrado" name="contrasteAdministrado">
              <span>Contraste administrado</span>
            </label>
          </div>

          <div *ngIf="preparacionForm.contrasteAdministrado" class="contraste-details">
            <div class="form-group">
              <label class="form-label">Tipo de contraste</label>
              <select class="form-select" [(ngModel)]="preparacionForm.tipoContraste" name="tipoContraste">
                <option value="">Seleccione...</option>
                <option value="yodo">Yodado (TC)</option>
                <option value="gadolinio">Gadolinio (RM)</option>
                <option value="bario">Bario</option>
                <option value="otro">Otro</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Dosis (ml)</label>
              <input type="text" class="form-input" [(ngModel)]="preparacionForm.dosisContraste" name="dosisContraste" placeholder="Ej: 100ml">
            </div>
          </div>
        </div>

        <!-- Historia Médica -->
        <div class="form-section">
          <h3 class="section-title">Historia Médica</h3>
          
          <div class="form-group">
            <label class="form-label">Alergias conocidas</label>
            <textarea class="form-textarea" [(ngModel)]="preparacionForm.alergiasConocidas" name="alergiasConocidas" rows="2" placeholder="Especificar alergias, especialmente a contrastes..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Medicamentos actuales</label>
            <textarea class="form-textarea" [(ngModel)]="preparacionForm.medicamentosActuales" name="medicamentosActuales" rows="2" placeholder="Listar medicamentos que toma el paciente..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Antecedentes médicos relevantes</label>
            <textarea class="form-textarea" [(ngModel)]="preparacionForm.antecedentesMedicos" name="antecedentesMedicos" rows="2" placeholder="Antecedentes que puedan afectar el estudio..."></textarea>
          </div>
        </div>

        <!-- Notas Adicionales -->
        <div class="form-section">
          <h3 class="section-title">Notas de Preparación</h3>
          
          <div class="form-group">
            <label class="form-label">Notas adicionales</label>
            <textarea class="form-textarea" [(ngModel)]="preparacionForm.notasPreparacion" name="notasPreparacion" rows="3" placeholder="Cualquier observación adicional..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Técnico responsable</label>
            <input type="text" class="form-input" [(ngModel)]="preparacionForm.tecnicoResponsable" name="tecnicoResponsable" placeholder="Nombre del técnico">
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn--secondary" (click)="goBack()">Cancelar</button>
          <button type="submit" class="btn btn--primary">
            <i class="fas fa-check"></i>
            Confirmar Preparación
          </button>
        </div>
      </form>
    </div>
  </div>
</app-layout>
